# Fly.io configuration for the NovaMind FastAPI backend.
#
# The backend lives at /api/v1/* on the same hostname as the frontend,
# so Vercel points NEXT_PUBLIC_API_URL at https://<app-name>.fly.dev/api/v1.
#
# Quick start (from the repo root, after installing the Fly CLI and
# running `fly auth login`):
#
#   cd backend
#   fly launch --no-deploy --copy-config   # creates the app from this file
#   fly secrets set \
#     SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')" \
#     DATABASE_URL="postgresql://user:pass@host/db?sslmode=require" \
#     BACKEND_CORS_ORIGINS="https://novamind-4zx31p7gb-devangshah7s-projects.vercel.app,http://localhost:3000" \
#     ALLOW_VERCEL_PREVIEWS=1 \
#     FRONTEND_BASE_URL="https://novamind-4zx31p7gb-devangshah7s-projects.vercel.app" \
#     PUBLIC_SITE_URL="https://novamind-4zx31p7gb-devangshah7s-projects.vercel.app"
#   fly deploy
#
# DATABASE_URL is the only required secret. Get it from Neon (free
# Postgres) at https://neon.tech or any other managed Postgres you
# trust. The backend uses `Base.metadata.create_all()` on first boot
# when RUN_DB_MIGRATIONS=1, so a fresh database is fine.

app = "novamind-api"   # change this if the name is already taken on Fly
primary_region = "bom" # Mumbai — close to your Vercel region. Change to sin, fra, etc. as needed.

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  RUN_DB_MIGRATIONS = "1"   # first deploy only — flip to "0" once the tables exist
  ALLOW_VERCEL_PREVIEWS = "1"
  # BACKEND_CORS_ORIGINS, FRONTEND_BASE_URL, PUBLIC_SITE_URL, DATABASE_URL,
  # and SECRET_KEY are *secrets* — set them with `fly secrets set` so
  # they don't leak into the public fly.toml.

[experimental]
  # auto_rollback keeps a bad release from being the live one. We
  # additionally set [deploy] release_command below to run a smoke
  # test before swapping.
  auto_rollback = true

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"   # free-tier default; bump to 1gb if the cold-start is too slow
  cpu_kind = "shared"
  cpus = 1
